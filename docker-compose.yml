services:
  inventory-db:
    container_name: inventory-db
    build:
      context: srcs/postgres-db
    restart: always
    environment:
      - DB_USER=${INVENTORY_DB_USER}
      - DB_PASS=${INVENTORY_DB_PASS}
      - DB_NAME=${INVENTORY_DB_NAME}
    expose:
      - 5432
    volumes:
      - inventory_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  inventory-app:
    container_name: inventory-app
    build:
      context: srcs/inventory-app
    env_file: .env
    restart: always
    expose:
      - ${INVENTORY_APP_PORT}
    depends_on:
      inventory-db:
        condition: service_healthy

  billing-db:
    container_name: billing-db
    build:
      context: srcs/postgres-db
    restart: always
    environment:
      - DB_USER=${BILLING_DB_USER}
      - DB_PASS=${BILLING_DB_PASS}
      - DB_NAME=${BILLING_DB_NAME}
    expose:
      - 5432
    volumes:
      - billing_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  billing-queue:
    container_name: billing-queue
    hostname: rabbit-host
    build:
      context: srcs/rabbitmq
    restart: always
    env_file: .env
    expose:
      - ${RABBITMQ_PORT}
    volumes:
      - billing-queue-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
  
  billing-app:
    container_name: billing-app
    build:
      context: srcs/billing-app
    env_file: .env
    environment:
      - RABBITMQ_HOST=billing-queue
    restart: always
    expose:
      - ${BILLING_APP_PORT}
    depends_on:
      billing-db:
        condition: service_healthy
      billing-queue:
        condition: service_healthy

  api-gateway:
    container_name: api-gateway
    build:
      context: srcs/api-gateway
    env_file: .env
    environment:
      - RABBITMQ_HOST=billing-queue
      - INVENTORY_APP_HOST=inventory-app
      - BILLING_APP_HOST=billing-app
    ports:
      - ${APIGATEWAY_PORT}:${APIGATEWAY_PORT}
    depends_on:
      billing-queue:
        condition: service_healthy

volumes:
  inventory_database:
  billing_database:
  billing-queue-data: